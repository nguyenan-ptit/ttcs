<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận hàng đổi trả - Élégance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body class="elegance-shell">
    <aside class="dashboard-sidebar">
        <div class="dashboard-brand">
            <a href="import.html" class="dashboard-brand-mark">ÉLÉGANCE</a>
            <div class="dashboard-brand-subtitle">Bảng điều hành kho</div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Menu chính</div>
            <a href="import.html" class="sidebar-link"><span>Thực hiện nhập kho</span></a>
            <a href="update-stock.html" class="sidebar-link"><span>Cập nhật tồn kho</span></a>
            <a href="return.html" class="sidebar-link active"><span>Nhận hàng đổi trả</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user-card">
                <div class="text-xs uppercase text-white/45">Nhân viên kho</div>
                <div id="warehouseUserName" class="mt-2 font-semibold">Nhân viên kho</div>
            </div>
            <button onclick="EleganceApp.logout('../auth/login.html')" class="btn-ghost mt-4 text-white/80">Đăng xuất</button>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <div>
                <h1 class="dashboard-header-title">Nhận hàng đổi trả</h1>
                <p class="dashboard-header-copy">Chọn phiếu đang xử lý để tự điền thông tin, chỉnh sửa nếu cần và xác nhận nhập lại vào kho.</p>
            </div>
            <div class="dashboard-header-actions">
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-500">Xin chào, <b id="warehouseHeaderName">Nhân viên kho</b></span>
                    <div id="warehouseAvatar" class="dashboard-avatar">K</div>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="grid xl:grid-cols-[1fr_0.95fr] gap-8">
                <section class="surface-card">
                    <div class="surface-card-body">
                        <div id="returnNotice" class="hidden mb-5"></div>
                        <div id="selectedReturnNotice" class="hidden mb-5"></div>
                        <form id="customerReturnForm" class="stack">
                            <div class="form-grid">
                                <div>
                                    <label class="form-label" for="returnSource">Khách hàng / mã đơn</label>
                                    <input id="returnSource" class="form-input" type="text" placeholder="Ví dụ: ORD-102265 - Trần Thị Mai">
                                </div>
                                <div>
                                    <label class="form-label" for="returnProduct">Sản phẩm</label>
                                    <select id="returnProduct" class="form-select"></select>
                                </div>
                                <div>
                                    <label class="form-label" for="returnVariant">Biến thể màu / size</label>
                                    <select id="returnVariant" class="form-select"></select>
                                </div>
                                <div>
                                    <label class="form-label" for="returnQuantity">Số lượng nhận lại</label>
                                    <input id="returnQuantity" class="form-input" type="text" inputmode="numeric" value="1">
                                </div>
                            </div>
                            <div>
                                <label class="form-label" for="returnReason">Lý do đổi trả</label>
                                <input id="returnReason" class="form-input" type="text" placeholder="Ví dụ: không vừa size, lỗi đường may, giao sai màu">
                            </div>
                            <div>
                                <label class="form-label" for="returnNote">Ghi chú kiểm tra hàng</label>
                                <textarea id="returnNote" class="form-textarea" placeholder="Ví dụ: hàng còn tem, nhập lại kho bán; hàng lỗi cần chuyển khu xử lý..."></textarea>
                            </div>
                            <div class="flex justify-end gap-3">
                                <button id="resetReturnButton" class="btn-secondary" type="button">Làm mới</button>
                                <button id="returnSubmitButton" class="btn-primary" type="submit">Xác nhận nhận hàng</button>
                            </div>
                        </form>
                    </div>
                </section>

                <section class="surface-card">
                    <div class="surface-card-body">
                        <div class="eyebrow">Đang xử lý</div>
                        <h2 class="section-title">Phiếu đổi trả gần đây</h2>
                        <div id="customerReturnList" class="quick-list mt-6"></div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="../../assets/js/main.js"></script>
    <script>
        let editingReturnId = null;

        function getCurrentStaffName() {
            return EleganceApp.getCurrentUser()?.name || 'Nhân viên kho';
        }

        function fillVariantSelect(productId) {
            const variants = EleganceApp.getProductVariants(productId);
            const select = document.getElementById('returnVariant');
            select.innerHTML = variants.map((variant) => `
                <option value="${variant.id}">${EleganceApp.getVariantLabel(variant)} - tồn hiện tại: ${variant.stock}</option>
            `).join('');
        }

        function findVariantIdByOrderItem(item) {
            const variant = EleganceApp.getDb().inventoryVariants.find((entry) =>
                entry.productId === item.productId &&
                entry.color === item.color &&
                entry.size === item.size
            );
            return variant?.id || '';
        }

        function getReturnStatusMeta(status) {
            if (status === 'completed') {
                return { className: 'badge-success', label: 'Đã nhập lại' };
            }
            if (status === 'rejected') {
                return { className: 'badge-danger', label: 'Từ chối' };
            }
            return { className: 'badge-warning', label: 'Đang xử lý' };
        }

        function resetReturnForm() {
            editingReturnId = null;
            document.getElementById('customerReturnForm').reset();
            const productSelect = document.getElementById('returnProduct');
            fillVariantSelect(productSelect.value);
            document.getElementById('returnQuantity').value = '1';
            document.getElementById('returnSubmitButton').textContent = 'Xác nhận nhận hàng';
            EleganceApp.hideNotice('selectedReturnNotice');
        }

        function selectReturnForReceive(returnId) {
            const db = EleganceApp.getDb();
            const record = db.returns.find((item) => item.id === returnId && item.type === 'customer');
            if (!record) {
                EleganceApp.renderNotice('returnNotice', 'Không tìm thấy phiếu đổi trả cần xử lý.', 'error');
                return;
            }
            if (record.status === 'completed') {
                EleganceApp.renderNotice('returnNotice', 'Phiếu này đã được nhập lại trước đó.', 'info');
                return;
            }

            let variantId = record.variantId || '';
            if (!variantId && record.orderId) {
                const order = db.orders.find((item) => item.id === record.orderId);
                const orderItem = order?.items.find((item) => item.productId === record.productId) || order?.items[0];
                if (orderItem) {
                    variantId = findVariantIdByOrderItem(orderItem);
                }
            }

            const productId = record.productId || db.products[0]?.id || '';
            document.getElementById('returnSource').value = record.orderId ? `${record.orderId} - ${record.source}` : (record.source || '');
            document.getElementById('returnProduct').value = productId;
            fillVariantSelect(productId);
            if (variantId) {
                document.getElementById('returnVariant').value = variantId;
            }
            document.getElementById('returnQuantity').value = record.qty || 1;
            document.getElementById('returnReason').value = record.reason || '';
            document.getElementById('returnNote').value = record.note || '';
            document.getElementById('returnSubmitButton').textContent = 'Xác nhận nhập lại';
            editingReturnId = returnId;

            EleganceApp.renderNotice(
                'selectedReturnNotice',
                `Đang xử lý phiếu ${returnId}. Bạn có thể chỉnh sửa thông tin trước khi xác nhận nhập lại.`,
                'info'
            );
        }

        function renderCustomerReturns() {
            const returns = EleganceApp.getDb().returns
                .filter((item) => item.type === 'customer')
                .slice(0, 10);

            document.getElementById('customerReturnList').innerHTML = returns.map((item) => {
                const meta = getReturnStatusMeta(item.status);
                const clickable = item.status !== 'completed' && item.status !== 'rejected';

                return `
                    <button
                        type="button"
                        class="quick-list-item w-full text-left ${clickable ? 'hover:bg-[#fffaf4] transition cursor-pointer' : 'cursor-default'}"
                        ${clickable ? `onclick="selectReturnForReceive('${item.id}')"` : 'disabled'}
                    >
                        <div>
                            <div class="font-semibold text-gray-900">${item.id} - ${item.productName}</div>
                            <div class="text-sm text-gray-500 mt-1">${item.variantLabel || 'Chưa chọn biến thể'} • ${item.qty} sản phẩm • ${item.source}</div>
                            ${clickable ? '<div class="text-xs text-[#a87b51] mt-2">Nhấn để điền thông tin và xác nhận nhập lại</div>' : ''}
                        </div>
                        <span class="badge ${meta.className}">${meta.label}</span>
                    </button>
                `;
            }).join('') || '<div class="empty-state">Chưa có phiếu đổi trả.</div>';
        }

        window.selectReturnForReceive = selectReturnForReceive;

        document.addEventListener('DOMContentLoaded', () => {
            const user = EleganceApp.ensureRole(['WAREHOUSE'], '../auth/login.html');
            if (!user) return;
            document.getElementById('warehouseUserName').textContent = user.name;
            EleganceApp.hydrateUser('warehouseHeaderName', 'warehouseAvatar', user.name);

            const productSelect = document.getElementById('returnProduct');
            productSelect.innerHTML = EleganceApp.getDb().products.map((product) => `
                <option value="${product.id}">${product.sku} - ${product.name}</option>
            `).join('');
            fillVariantSelect(productSelect.value);
            renderCustomerReturns();

            productSelect.addEventListener('change', () => fillVariantSelect(productSelect.value));
            document.getElementById('resetReturnButton').addEventListener('click', resetReturnForm);

            document.getElementById('customerReturnForm').addEventListener('submit', (event) => {
                event.preventDefault();
                const quantity = document.getElementById('returnQuantity').value.trim();
                if (!quantity || !/^\d+$/.test(quantity)) {
                    EleganceApp.renderNotice('returnNotice', 'Số lượng nhận lại không được bỏ trống và phải là số nguyên hợp lệ.', 'error');
                    document.getElementById('returnQuantity').focus();
                    return;
                }

                const source = document.getElementById('returnSource').value.trim();
                const reason = document.getElementById('returnReason').value.trim();
                if (!source || !reason) {
                    EleganceApp.renderNotice('returnNotice', 'Vui lòng nhập thông tin khách hàng/mã đơn và lý do đổi trả.', 'error');
                    return;
                }

                try {
                    const variantId = document.getElementById('returnVariant').value;
                    const variant = EleganceApp.findVariantById(variantId);
                    const product = EleganceApp.findProductById(variant.productId);
                    const returnQty = Number(quantity);
                    const note = document.getElementById('returnNote').value.trim();

                    EleganceApp.updateDb((db) => {
                        const targetVariant = db.inventoryVariants.find((item) => item.id === variantId);
                        targetVariant.stock += returnQty;

                        const targetProduct = db.products.find((item) => item.id === product.id);
                        targetProduct.stock = db.inventoryVariants
                            .filter((item) => item.productId === product.id)
                            .reduce((sum, item) => sum + Number(item.stock || 0), 0);
                        targetProduct.status = targetProduct.stock <= 10 ? 'low' : (targetProduct.status === 'draft' ? 'draft' : 'active');

                        if (editingReturnId) {
                            const targetReturn = db.returns.find((item) => item.id === editingReturnId && item.type === 'customer');
                            if (!targetReturn) {
                                throw new Error('Không tìm thấy phiếu đổi trả đang xử lý.');
                            }

                            targetReturn.source = source;
                            targetReturn.productId = product.id;
                            targetReturn.productName = product.name;
                            targetReturn.variantId = variantId;
                            targetReturn.variantLabel = EleganceApp.getVariantLabel(targetVariant);
                            targetReturn.qty = returnQty;
                            targetReturn.reason = reason;
                            targetReturn.note = note;
                            targetReturn.status = 'completed';
                            targetReturn.staff = getCurrentStaffName();
                            targetReturn.receivedDate = new Date().toISOString().slice(0, 10);

                            if (targetReturn.orderId) {
                                const targetOrder = db.orders.find((item) => item.id === targetReturn.orderId);
                                if (targetOrder && targetOrder.status === 'return_requested') {
                                    targetOrder.status = 'received';
                                    targetOrder.note = note
                                        ? `Kho đã nhận hàng đổi trả: ${note}`
                                        : 'Kho đã xác nhận nhận hàng đổi trả.';
                                }
                            }
                        } else {
                            db.returns.unshift({
                                id: `RTN-${String(db.returns.length + 1).padStart(4, '0')}`,
                                type: 'customer',
                                date: new Date().toISOString().slice(0, 10),
                                source,
                                productId: product.id,
                                productName: product.name,
                                variantId,
                                variantLabel: EleganceApp.getVariantLabel(targetVariant),
                                qty: returnQty,
                                reason,
                                note,
                                status: 'completed',
                                staff: getCurrentStaffName()
                            });
                        }
                    });

                    EleganceApp.renderNotice('returnNotice', 'Đã xác nhận nhận hàng đổi trả và cập nhật tồn kho.', 'success');
                    renderCustomerReturns();
                    resetReturnForm();
                } catch (error) {
                    EleganceApp.renderNotice('returnNotice', error.message, 'error');
                }
            });
        });
    </script>
</body>

</html>

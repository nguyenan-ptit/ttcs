<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhận hàng đổi trả - Élégance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body class="elegance-shell">
    <aside class="dashboard-sidebar">
        <div class="dashboard-brand">
            <a href="import.html" class="dashboard-brand-mark">ÉLÉGANCE</a>
            <div class="dashboard-brand-subtitle">Bảng điều hành kho</div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Menu chính</div>
            <a href="import.html" class="sidebar-link"><span>Thực hiện nhập kho</span></a>
            <a href="update-stock.html" class="sidebar-link"><span>Cập nhật tồn kho</span></a>
            <a href="return.html" class="sidebar-link active"><span>Nhận hàng đổi trả</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user-card">
                <div class="text-xs uppercase text-white/45">Nhân viên kho</div>
                <div id="warehouseUserName" class="mt-2 font-semibold">Nhân viên kho</div>
            </div>
            <button onclick="EleganceApp.logout('../auth/login.html')" class="btn-ghost mt-4 text-white/80">Đăng xuất</button>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <div>
                <h1 class="dashboard-header-title">Nhận hàng đổi trả</h1>
                <p class="dashboard-header-copy">Chọn phiếu đổi trả hoặc nhập thủ công để xác nhận hàng được nhập lại vào kho.</p>
            </div>
            <div class="dashboard-header-actions">
                <div class="flex items-center gap-3">
                    <span class="text-sm text-gray-500">Xin chào, <b id="warehouseHeaderName">Nhân viên kho</b></span>
                    <div id="warehouseAvatar" class="dashboard-avatar">K</div>
                </div>
            </div>
        </header>

        <div class="dashboard-content">
            <div class="grid xl:grid-cols-[1fr_0.95fr] gap-8">
                <section class="surface-card">
                    <div class="surface-card-body">
                        <div id="returnNotice" class="hidden mb-5"></div>
                        <div id="selectedReturnNotice" class="hidden mb-5"></div>
                        <form id="customerReturnForm" class="stack">
                            <div class="form-grid">
                                <div>
                                    <label class="form-label" for="returnSource">Khách hàng / mã đơn</label>
                                    <input id="returnSource" class="form-input" type="text" placeholder="Ví dụ: ORD-001 - Hoàng Văn Nam">
                                </div>
                                <div>
                                    <label class="form-label" for="returnProduct">Sản phẩm</label>
                                    <select id="returnProduct" class="form-select"></select>
                                </div>
                                <div>
                                    <label class="form-label" for="returnVariant">Biến thể màu / size</label>
                                    <select id="returnVariant" class="form-select"></select>
                                </div>
                                <div>
                                    <label class="form-label" for="returnQuantity">Số lượng nhận lại</label>
                                    <input id="returnQuantity" class="form-input" type="text" inputmode="numeric" value="1">
                                </div>
                            </div>
                            <div>
                                <label class="form-label" for="returnReason">Lý do đổi trả</label>
                                <input id="returnReason" class="form-input" type="text" placeholder="Ví dụ: không vừa size, lỗi đường may, giao sai màu">
                            </div>
                            <div>
                                <label class="form-label" for="returnNote">Ghi chú kiểm tra hàng</label>
                                <textarea id="returnNote" class="form-textarea" placeholder="Ví dụ: hàng còn tem, nhập lại kho bán; hàng lỗi cần chuyển khu xử lý..."></textarea>
                            </div>
                            <div class="flex justify-end gap-3">
                                <button id="resetReturnButton" class="btn-secondary" type="button">Làm mới</button>
                                <button id="returnSubmitButton" class="btn-primary" type="submit">Xác nhận nhận hàng</button>
                            </div>
                        </form>
                    </div>
                </section>

                <section class="surface-card">
                    <div class="surface-card-body">
                        <div class="eyebrow">Gần đây</div>
                        <h2 class="section-title">Phiếu đổi trả</h2>
                        <div id="customerReturnList" class="quick-list mt-6"></div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="../../assets/js/api.js"></script>
    <script src="../../assets/js/main.js"></script>
    <script>
        let editingReturn = null;
        let products = [];
        let customerReturns = [];

        function getCurrentUserId() {
            return EleganceApp.getCurrentUser()?.userId;
        }

        function findProduct(productId) {
            return products.find((product) => product.id === productId);
        }

        function getProductVariants(productId) {
            return findProduct(productId)?.variants || [];
        }

        function getReturnStatusMeta(status) {
            const map = {
                pending: { className: 'badge-info', label: 'Chờ xử lý' },
                processing: { className: 'badge-warning', label: 'Đang xử lý' },
                completed: { className: 'badge-success', label: 'Đã nhập lại' },
                rejected: { className: 'badge-danger', label: 'Từ chối' }
            };

            return map[status] || { className: 'badge-dark', label: status || 'Không rõ' };
        }

        function fillProductSelect(selectedId) {
            const select = document.getElementById('returnProduct');

            select.innerHTML = products.map((product) => `
                <option value="${product.id}" ${product.id === selectedId ? 'selected' : ''}>${product.sku} - ${product.name}</option>
            `).join('');

            if (!products.length) {
                select.innerHTML = '<option value="">Chưa có sản phẩm</option>';
            }

            fillVariantSelect(select.value);
        }

        function fillVariantSelect(productId, selectedVariantId) {
            const variants = getProductVariants(productId);
            const select = document.getElementById('returnVariant');

            select.innerHTML = variants.map((variant) => `
                <option value="${variant.id}" ${variant.id === selectedVariantId ? 'selected' : ''}>
                    ${variant.color} / ${variant.size} - tồn hiện tại: ${variant.stock}${variant.status === 'draft' ? ' - đang ẩn' : ''}
                </option>
            `).join('');

            if (!variants.length) {
                select.innerHTML = '<option value="">Sản phẩm chưa có biến thể</option>';
            }
        }

        function resetReturnForm() {
            editingReturn = null;
            document.getElementById('customerReturnForm').reset();
            document.getElementById('returnQuantity').value = '1';
            document.getElementById('returnSubmitButton').textContent = 'Xác nhận nhận hàng';
            fillProductSelect(products[0]?.id);
            EleganceApp.hideNotice('selectedReturnNotice');
        }

        function selectReturnForReceive(returnItemId) {
            const record = customerReturns.find((item) => item.id === returnItemId);

            if (!record) {
                EleganceApp.renderNotice('returnNotice', 'Không tìm thấy phiếu đổi trả cần xử lý.', 'error');
                return;
            }

            if (record.status === 'completed') {
                EleganceApp.renderNotice('returnNotice', 'Phiếu này đã được nhập lại trước đó.', 'info');
                return;
            }

            if (record.status === 'rejected') {
                EleganceApp.renderNotice('returnNotice', 'Phiếu này đã bị từ chối.', 'error');
                return;
            }

            editingReturn = record;

            document.getElementById('returnSource').value = record.orderId ? `${record.orderId} - ${record.source}` : (record.source || '');
            fillProductSelect(record.productId);
            fillVariantSelect(record.productId, record.variantId);
            document.getElementById('returnQuantity').value = record.qty || 1;
            document.getElementById('returnReason').value = record.reason || '';
            document.getElementById('returnNote').value = record.note || '';
            document.getElementById('returnSubmitButton').textContent = 'Xác nhận nhập lại';

            EleganceApp.renderNotice(
                'selectedReturnNotice',
                `Đang xử lý phiếu ${record.returnId}. Bạn có thể chỉnh sửa số lượng trước khi xác nhận nhập lại.`,
                'info'
            );
        }

        function renderCustomerReturns() {
            document.getElementById('customerReturnList').innerHTML = customerReturns.map((item) => {
                const meta = getReturnStatusMeta(item.status);
                const clickable = item.status !== 'completed' && item.status !== 'rejected';

                return `
                    <button
                        type="button"
                        class="quick-list-item w-full text-left ${clickable ? 'hover:bg-[#fffaf4] transition cursor-pointer' : 'cursor-default'}"
                        ${clickable ? `onclick="selectReturnForReceive('${item.id}')"` : 'disabled'}
                    >
                        <div>
                            <div class="font-semibold text-gray-900">${item.returnId || item.id} - ${item.productName}</div>
                            <div class="text-sm text-gray-500 mt-1">${item.variantLabel || 'Chưa chọn biến thể'} • ${item.qty} sản phẩm • ${item.source || '--'}</div>
                            <div class="text-xs text-gray-400 mt-2">${item.orderId || 'Không gắn đơn'} • ${EleganceApp.formatDate(item.date)}</div>
                        </div>
                        <span class="badge ${meta.className}">${meta.label}</span>
                    </button>
                `;
            }).join('') || '<div class="empty-state">Chưa có phiếu đổi trả từ đơn hàng. Bạn vẫn có thể nhập thủ công ở form bên trái.</div>';
        }

        async function loadReturnData() {
            [products, customerReturns] = await Promise.all([
                apiGet('/inventory/products'),
                apiGet('/inventory/customer-returns')
            ]);

            fillProductSelect(document.getElementById('returnProduct').value || products[0]?.id);
            renderCustomerReturns();
        }

        window.selectReturnForReceive = selectReturnForReceive;

        document.addEventListener('DOMContentLoaded', async () => {
            const user = EleganceApp.ensureRole(['WAREHOUSE'], '../auth/login.html');
            if (!user) return;

            document.getElementById('warehouseUserName').textContent = user.name;
            EleganceApp.hydrateUser('warehouseHeaderName', 'warehouseAvatar', user.name);

            document.getElementById('returnProduct').addEventListener('change', (event) => {
                fillVariantSelect(event.target.value);
            });

            document.getElementById('resetReturnButton').addEventListener('click', resetReturnForm);

            document.getElementById('customerReturnForm').addEventListener('submit', async (event) => {
                event.preventDefault();

                const variantId = document.getElementById('returnVariant').value;
                const quantity = document.getElementById('returnQuantity').value.trim();
                const source = document.getElementById('returnSource').value.trim();
                const reason = document.getElementById('returnReason').value.trim();
                const note = document.getElementById('returnNote').value.trim();

                if (!variantId) {
                    EleganceApp.renderNotice('returnNotice', 'Vui lòng chọn biến thể cần nhập lại.', 'error');
                    return;
                }

                if (!/^[1-9]\d*$/.test(quantity)) {
                    EleganceApp.renderNotice('returnNotice', 'Số lượng nhận lại phải là số nguyên lớn hơn 0.', 'error');
                    document.getElementById('returnQuantity').focus();
                    return;
                }

                if (!source || !reason) {
                    EleganceApp.renderNotice('returnNotice', 'Vui lòng nhập thông tin khách hàng/mã đơn và lý do đổi trả.', 'error');
                    return;
                }

                try {
                    await apiPost('/inventory/customer-returns/receive', {
                        returnId: editingReturn?.returnId || null,
                        variantId,
                        quantity: Number(quantity),
                        source,
                        reason,
                        note,
                        userId: getCurrentUserId()
                    });

                    EleganceApp.renderNotice('returnNotice', 'Đã xác nhận nhận hàng đổi trả và cập nhật tồn kho.', 'success');
                    await loadReturnData();
                    resetReturnForm();
                } catch (error) {
                    EleganceApp.renderNotice('returnNotice', error.message, 'error');
                }
            });

            try {
                await loadReturnData();
            } catch (error) {
                EleganceApp.renderNotice('returnNotice', error.message || 'Không tải được dữ liệu đổi trả.', 'error');
            }
        });
    </script>
</body>

</html>

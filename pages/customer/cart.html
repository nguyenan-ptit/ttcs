<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng - Élégance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        body {
            font-family: 'Montserrat', sans-serif;
        }

        .font-serif {
            font-family: 'Playfair Display', serif;
        }
    </style>
</head>

<body class="bg-[#fcfaf8] text-gray-800 min-h-screen flex flex-col">

    <header
        class="container mx-auto px-6 py-6 flex items-center justify-between border-b border-gray-200 bg-[#fcfaf8] sticky top-0 z-50">
        <a href="../../index.html"
            class="text-3xl font-serif tracking-[0.2em] text-[#a87b51] hover:text-[#8b633f] transition">
            ÉLÉGANCE
        </a>

        <div class="flex items-center space-x-6">

            <div data-customer-account data-login-path="../auth/login.html" data-orders-path="orders.html"
                data-cart-path="cart.html" data-profile-path="profile.html"></div>
        </div>
    </header>

    <main class="container mx-auto px-6 py-10 flex-grow">
        <h1 class="text-3xl font-serif font-semibold text-center mb-10">GIỎ HÀNG CỦA BẠN</h1>

        <div class="flex flex-col lg:flex-row gap-8">
            <div class="lg:w-2/3 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div id="cartItemsContainer" class="divide-y divide-gray-100">
                </div>

                <div id="emptyCartMessage" class="hidden text-center py-10">
                    <p class="text-gray-500 mb-4">Giỏ hàng của bạn đang trống.</p>
                    <a href="../../index.html"
                        class="inline-block bg-[#a87b51] text-white px-6 py-2 rounded-lg hover:bg-[#8b633f] transition">Tiếp
                        tục mua sắm</a>
                </div>
            </div>

            <div class="lg:w-1/3">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 sticky top-28">
                    <h2 class="text-lg font-bold mb-4 uppercase tracking-wider border-b pb-2">Tóm tắt đơn hàng</h2>

                    <div class="flex justify-between mb-3 text-gray-600">
                        <span>Tạm tính:</span>
                        <span id="subTotal" class="font-medium">0 đ</span>
                    </div>
                    <div class="flex justify-between mb-4 text-gray-600 border-b pb-4">
                        <span>Phí giao hàng:</span>
                        <span class="font-medium">Miễn phí</span>
                    </div>

                    <div class="flex justify-between mb-8 text-xl font-bold text-black">
                        <span>Tổng cộng:</span>
                        <span id="totalAmount" class="text-[#a87b51]">0 đ</span>
                    </div>

                    <button onclick="proceedToCheckout()"
                        class="w-full bg-[#1a1a1a] text-white py-4 rounded-xl font-bold uppercase tracking-widest hover:bg-[#a87b51] transition duration-300">
                        TIẾN HÀNH THANH TOÁN
                    </button>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-white border-t border-gray-200 py-6 mt-auto">
        <div class="container mx-auto px-6 text-center text-sm text-gray-500">
            <p>© 2026 ÉLÉGANCE. All rights reserved.</p>
        </div>
    </footer>

    <script src="../../assets/js/main.js"></script>
    <script src="../../assets/js/order.js"></script>
</body>

</html>

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý danh mục - Élégance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../../assets/css/style.css">
    <style>body { font-family: 'Montserrat', sans-serif; }</style>
</head>

<body class="elegance-shell">
    <aside class="dashboard-sidebar">
        <div class="dashboard-brand">
            <a href="../dashboard.html" class="dashboard-brand-mark">ÉLÉGANCE</a>
            <div class="dashboard-brand-subtitle">Bảng điều hành quản lý</div>
        </div>
        <nav class="sidebar-nav">
            <div class="sidebar-section-title">Menu chính</div>
            <a href="../store/store-info.html" class="sidebar-link"><span>Quản lý thông tin cửa hàng</span></a>
            <a href="category-list.html" class="sidebar-link active"><span>Quản lý danh mục</span></a>
            <a href="../product/product-list.html" class="sidebar-link"><span>Quản lý sản phẩm</span></a>
            <a href="../promotion/promotion-list.html" class="sidebar-link"><span>Quản lý khuyến mãi</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="sidebar-user-card">
                <div class="text-xs uppercase text-white/45">Quản lý</div>
                <div id="managerSidebarName" class="mt-2 font-semibold">Quản lý</div>
            </div>
            <button onclick="EleganceApp.logout('../../auth/login.html')" class="btn-ghost mt-4 text-white/80">Đăng xuất</button>
        </div>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <div>
                <h1 class="dashboard-header-title">Quản lý danh mục</h1>
                <p class="dashboard-header-copy">Thêm mới, sửa và ẩn các danh mục sản phẩm.</p>
            </div>

            <button onclick="openCategoryForm()" class="btn-primary">Thêm danh mục</button>
        </header>

        <div class="dashboard-content">
            <section class="surface-card">
                <div class="surface-card-body">
                    <div id="categoryNotice" class="hidden mb-5"></div>
                    <div class="toolbar">
                        <input id="categorySearch" class="form-input max-w-md" type="text" placeholder="Tìm theo tên danh mục">
                    </div>
                    <div class="data-table-wrap">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Mã</th>
                                    <th>Tên danh mục</th>
                                    <th>Số sản phẩm</th>
                                    <th>Trạng thái</th>
                                    <th>Hành động</th>
                                </tr>
                            </thead>
                            <tbody id="categoryTable"></tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="categoryModal" class="hidden fixed inset-0 z-50 bg-black/40 items-center justify-center p-6">
        <div class="bg-white rounded-2xl w-full max-w-2xl shadow-xl">
            <div class="px-6 py-5 border-b border-gray-100">
                <h2 id="categoryModalTitle" class="text-xl font-semibold text-gray-900">Thêm danh mục</h2>
            </div>
            <form id="categoryForm" class="p-6 stack">
                <input id="categoryId" type="hidden">
                <div class="form-grid">
                    <div>
                        <label class="form-label" for="categoryName">Tên danh mục</label>
                        <input class="form-input" id="categoryName" type="text" required>
                    </div>
                    <div>
                        <label class="form-label" for="categoryStatus">Trạng thái</label>
                        <select class="form-select" id="categoryStatus">
                            <option value="active">Đang dùng</option>
                            <option value="draft">Bản nháp</option>
                        </select>
                    </div>
                    <div>
                        <label class="form-label" for="categorySizeType">Kiểu size</label>
                        <select class="form-select" id="categorySizeType">
                            <option value="LETTER">Size chữ: S, M, L, XL</option>
                            <option value="NUMBER">Size số: 28, 29, 30, 31</option>
                        </select>
                    </div>
                </div>
                <div class="flex justify-end gap-3">
                    <button type="button" onclick="closeCategoryForm()" class="btn-secondary">Hủy</button>
                    <button type="submit" class="btn-primary">Lưu danh mục</button>
                </div>
            </form>
        </div>
    </div>
    <script src="../../../assets/js/api.js"></script>
    <script src="../../../assets/js/main.js"></script>
    <script>
        let categoryKeyword = '';
        let categories = [];
        async function loadCategories() {
            categories = await apiGet('/products/categories');
            renderCategoryTable();
        }
        function getCategoryMeta(status) {
            return status === 'active'
                ? { label: 'Đang dùng', className: 'badge-success' }
                : { label: 'Bản nháp', className: 'badge-dark' };
        }

        function renderCategoryTable() {
            const keyword = EleganceApp.normalizeText(categoryKeyword);
            const rows = categories.filter((category) =>
                !keyword || EleganceApp.normalizeText(category.name).includes(keyword)
            );

            document.getElementById('categoryTable').innerHTML = rows.map((category) => {
                const meta = getCategoryMeta(category.status);
                return `
                    <tr>
                        <td>${category.id}</td>
                        <td class="font-semibold text-gray-900">${category.name}</td>
                        <td>${category.productCount || 0}</td>
                        <td><span class="badge ${meta.className}">${meta.label}</span></td>
                        <td>
                            <div class="flex flex-wrap gap-3">
                                <button onclick="openCategoryForm('${category.categoryId}')" class="text-[#a87b51] font-medium">Sửa</button>
                                <button onclick="toggleCategoryHidden('${category.categoryId}')" class="text-amber-700 font-medium">${category.status === 'draft' ? 'Hiện' : 'Ẩn'}</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('') || '<tr><td colspan="5" class="empty-state">Chưa có danh mục nào.</td></tr>';
        }

        function openCategoryForm(categoryId) {
            const category = categoryId
                ? categories.find((item) => Number(item.categoryId) === Number(categoryId))
                : null;

            document.getElementById('categoryModalTitle').textContent = category ? 'Sửa danh mục' : 'Thêm danh mục';
            document.getElementById('categoryId').value = category?.categoryId || '';
            document.getElementById('categoryName').value = category?.name || '';
            document.getElementById('categoryStatus').value = category?.status || 'active';
            document.getElementById('categorySizeType').value = category?.sizeType || 'LETTER';
            document.getElementById('categoryModal').classList.remove('hidden');
            document.getElementById('categoryModal').classList.add('flex');
        }

        function closeCategoryForm() {
            document.getElementById('categoryModal').classList.add('hidden');
            document.getElementById('categoryModal').classList.remove('flex');
        }

        async function toggleCategoryHidden(categoryId) {
            const category = categories.find((item) => Number(item.categoryId) === Number(categoryId));

            if (!category) {
                EleganceApp.renderNotice('categoryNotice', 'Không tìm thấy danh mục.', 'error');
                return;
            }
            const nextIsActive = category.status === 'draft';

            try {
                await apiPatch(`/products/categories/${categoryId}/status`, {
                    isActive: nextIsActive
                });

                EleganceApp.renderNotice(
                    'categoryNotice',
                    nextIsActive ? 'Đã hiện danh mục.' : 'Đã ẩn danh mục.',
                    'success'
                );

                await loadCategories();
            } catch (error) {
                EleganceApp.renderNotice(
                    'categoryNotice',
                    error.message || 'Không thể cập nhật trạng thái danh mục.',
                    'error'
                );
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const user = EleganceApp.ensureRole(['MANAGER'], '../../auth/login.html');
            if (!user) return;
            document.getElementById('managerSidebarName').textContent = user.name;

            document.getElementById('categorySearch').addEventListener('input', (event) => {
                categoryKeyword = event.target.value;
                renderCategoryTable();
            });

            document.getElementById('categoryForm').addEventListener('submit', async (event) => {
                event.preventDefault();
                const id = document.getElementById('categoryId').value;
                const payload = {
                    name: document.getElementById('categoryName').value.trim(),
                    status: document.getElementById('categoryStatus').value,
                    sizeType: document.getElementById('categorySizeType').value
                };

                try {
                    if (id) {
                        await apiPut(`/products/categories/${id}`, {
                            name: payload.name,
                            sizeType: payload.sizeType
                        });

                        await apiPatch(`/products/categories/${id}/status`, {
                            isActive: payload.status === 'active'
                        });
                    } else {
                        await apiPost('/products/categories', {
                            name: payload.name,
                            sizeType: payload.sizeType
                        });
                    }

                    closeCategoryForm();
                    EleganceApp.renderNotice(
                        'categoryNotice',
                        id ? 'Đã cập nhật danh mục.' : 'Đã thêm danh mục mới.',
                        'success'
                    );

                    await loadCategories();
                } catch (error) {
                    EleganceApp.renderNotice(
                        'categoryNotice',
                        error.message || 'Không thể lưu danh mục.',
                        'error'
                    );
                }
            });

            loadCategories();
        });
    </script>
</body>

</html>

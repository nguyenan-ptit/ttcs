<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập hệ thống</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-sm border-0 rounded-3">
                    <div class="card-body p-4 p-md-5">
                        <div class="text-center mb-4">
                            <h2 class="fw-bold">ĐĂNG NHẬP</h2>
                            <p class="text-muted">Vui lòng nhập tài khoản của bạn</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Tên đăng nhập</label>
                                <input type="text" class="form-control" id="username" placeholder="Nhập username"
                                    required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <input type="password" class="form-control" id="password" placeholder="Nhập mật khẩu"
                                    required>
                            </div>

                            <div id="loginError" class="alert alert-danger d-none py-2 text-center" role="alert">
                                Sai tài khoản hoặc mật khẩu!
                            </div>

                            <button type="submit" class="btn btn-dark w-100 py-2 mb-3 fw-bold">ĐĂNG NHẬP</button>
                        </form>

                        <div class="text-center">
                            <span class="text-muted">Chưa có tài khoản? </span>
                            <a href="register.html" class="text-decoration-none text-primary fw-semibold">Đăng ký
                                ngay</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../assets/js/auth.js"></script>
</body>

</html>
